<!--Weather Forecast-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <div id="container">
        <div id="main">

            <div id="header">
                <img width="48" height="48" src="https://img.icons8.com/emoji/48/cloud-emoji.png" alt="cloud-emoji"/>
                <h1>Weather App</h1>
                <img width="50" height="50" src="https://img.icons8.com/keek/50/sun.png" alt="sun"/>
            </div>

            <div id="line"></div>

            <div id="inputs">
                <input type="text" name="city" id="city" placeholder="Enter City Name">
                <button type="submit" id="button">Get Weather</button>
            </div>



            <div class="first">
                <div id="left">
                    <div id="location" style="margin-left: 25px;">location Denied</div>
                    <div id="temp">_</div>
                    <div id="forecast">-</div>

                </div>

                <div id="right">
                    <div id="rightfirst">
                        <img width="48" height="48" src="https://img.icons8.com/emoji/48/droplet.png" alt="droplet" style="margin-bottom: -5px;"/>
                        <div class="moisturevalue">-</div>
                    </div>
                    
                    <div id="rightsecond">
                        <img width="50" height="50" src="https://img.icons8.com/ios/50/wind--v1.png" alt="wind--v1" style="filter: brightness(0) saturate(100%) invert(100%) sepia(0%) saturate(579%) hue-rotate(174deg) brightness(111%) contrast(81%);"/>
                        <div class="windvalue">-</div>
                    </div>
                </div>
            </div>  

            <div class="second">
                <div class="bottomelement">
                    <div id="bottomcontent">Pressure</div>
                    <div id="pressurevalue">__</div>
                </div>
                <div class="line"></div>

                <div class="bottomelement">
                    <div id="bottomcontent">Visibility</div>
                    <div id="visibilityvalue">__</div>
                </div>
                <div class="line"></div>

                <div class="bottomelement">
                    <div id="bottomcontent">Feels Like</div>
                    <div id="feelslikevalue">__</div>
                </div>
                <div class="line"></div>

                <div class="bottomelement">
                    <div id="bottomcontent">Sea Level</div>
                    <div id="sealevelvalue">__</div>
                </div>
                <div class="line"></div>

                <div class="bottomelement">
                    <div id="bottomcontent">Ground Level</div>
                    <div id="groundlevelvalue">__</div>
                </div>
                <div class="line"></div>

                <div class="bottomelement">
                    <div id="bottomcontent">Sunrise</div>
                    <div id="sunrisevalue">__</div>
                </div>
                <div class="line"></div>

                <div class="bottomelement">
                    <div id="bottomcontent">Sunset</div>
                    <div id="sunsetvalue">__</div>
                </div>
            </div> 


        </div>
    </div>
    
</body>
<script src="./script.js"></script>
</html>
